<!doctype html>
<html lang="fa" dir="rtl" data-pa-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PAdminLTE — داشبورد ۳</title>
  <link rel="stylesheet" href="../css/padminlte.css">
</head>
<body>
  <a class="pa-skip-link" href="#pa-main-content">پرش به محتوا</a>
  <div class="pa-app">
    <div data-pa-layout="sidebar"></div>
    <div class="pa-main">
      <div data-pa-layout="header"></div>
      <main class="pa-content" id="pa-main-content">
        <div class="pa-page-header">
          <div><h1>داشبورد ۳ — اسپارک‌لاین‌ها</h1><div class="pa-breadcrumb"><a href="../index.html">خانه</a><span class="pa-sep">›</span><span>داشبورد ۳</span></div></div>
        </div>

        <div class="pa-row">
          <div class="pa-col-3"><div class="pa-card"><div class="pa-card-body"><p class="pa-text-muted pa-fs-sm">بازدید</p><h3>۱۰٬۲۴۵</h3><canvas height="40" data-pa-chart="sparkline" data-pa-chart-data='{"values":[5,8,7,12,9,15,18,14,20,22,19,25],"color":"#0d6efd"}'></canvas></div></div></div>
          <div class="pa-col-3"><div class="pa-card"><div class="pa-card-body"><p class="pa-text-muted pa-fs-sm">فروش</p><h3>۸٬۹۰۰</h3><canvas height="40" data-pa-chart="sparkline" data-pa-chart-data='{"values":[10,8,12,15,11,14,18,16,20,17,21,23],"color":"#198754"}'></canvas></div></div></div>
          <div class="pa-col-3"><div class="pa-card"><div class="pa-card-body"><p class="pa-text-muted pa-fs-sm">هزینه</p><h3>۳٬۲۰۰</h3><canvas height="40" data-pa-chart="sparkline" data-pa-chart-data='{"values":[8,6,9,7,10,8,12,9,11,13,10,12],"color":"#dc3545"}'></canvas></div></div></div>
          <div class="pa-col-3"><div class="pa-card"><div class="pa-card-body"><p class="pa-text-muted pa-fs-sm">کاربران</p><h3>۲٬۴۵۰</h3><canvas height="40" data-pa-chart="sparkline" data-pa-chart-data='{"values":[3,5,4,7,6,9,8,11,10,13,12,15],"color":"#ffc107"}'></canvas></div></div></div>
        </div>

        <div class="pa-row">
          <div class="pa-col-12">
            <div class="pa-card"><div class="pa-card-header"><h3>نمای کلی ترکیبی</h3></div>
              <div class="pa-card-body">
                <div class="pa-chart-wrap"><canvas data-pa-chart="bar" data-pa-chart-data='{"labels":["شنبه","یکشنبه","دوشنبه","سه‌شنبه","چهارشنبه","پنجشنبه","جمعه"],"series":[{"label":"فروش","values":[30,45,38,52,48,60,55]},{"label":"بازدید","values":[100,120,140,135,160,180,170]}],"colors":["#0d6efd","#198754"]}'></canvas></div>
                <div class="pa-chart-legend"><span class="pa-cl-item"><span class="pa-cl-dot" style="background:#0d6efd"></span> فروش</span><span class="pa-cl-item"><span class="pa-cl-dot" style="background:#198754"></span> بازدید</span></div>
              </div>
            </div>
          </div>
        </div>

        <div data-pa-layout="footer"></div>
      </main>
    </div>
  </div>
  <script src="../js/pa-icons.js"></script>
  <script src="../js/padminlte.js"></script>
  <script src="../js/pa-layout.js"></script>
</body>
</html>
