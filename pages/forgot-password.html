<!doctype html>
<html lang="fa" dir="rtl" data-pa-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PAdminLTE — فراموشی رمز عبور</title>
  <link rel="stylesheet" href="../css/padminlte.css">
</head>
<body class="pa-auth-page">
  <div class="pa-auth-card pa-anim-slide-up">
    <div class="pa-auth-logo">P</div>
    <h1>بازیابی رمز عبور</h1>
    <p class="pa-sub">ایمیل خود را وارد کنید تا لینک بازیابی برایتان ارسال شود</p>

    <div class="pa-alert pa-alert-info">
      <span data-pa-icon="key_alt" data-pa-icon-size="20"></span>
      <div class="pa-alert-body">لینک بازیابی تا ۳۰ دقیقه معتبر خواهد بود.</div>
    </div>

    <form data-pa-validate-form onsubmit="return false">
      <div class="pa-form-group">
        <label for="email">ایمیل</label>
        <div class="pa-input-group">
          <span class="pa-input-addon" data-pa-icon="envelope" data-pa-icon-size="16"></span>
          <input class="pa-input" type="email" id="email" name="email" placeholder="name@example.com" data-pa-validate="email" required>
        </div>
        <div class="pa-form-feedback"></div>
      </div>
      <button type="submit" class="pa-btn pa-btn-primary pa-btn-block pa-btn-lg">ارسال لینک بازیابی</button>
    </form>

    <p class="pa-text-center pa-text-muted pa-fs-sm">
      به یاد آوردید؟ <a href="login.html">ورود</a>
    </p>
    <p class="pa-text-center"><a href="../index.html">← بازگشت به خانه</a></p>
  </div>
  <script src="../js/pa-icons.js"></script>
  <script src="../js/padminlte.js"></script>
</body>
</html>
