<!doctype html>
<html lang="fa" dir="rtl" data-pa-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PAdminLTE — نمودارها</title>
  <link rel="stylesheet" href="../css/padminlte.css">
</head>
<body>
  <a class="pa-skip-link" href="#pa-main-content">پرش به محتوا</a>
  <div class="pa-app">
    <div data-pa-layout="sidebar"></div>
    <div class="pa-main">
      <div data-pa-layout="header"></div>
      <main class="pa-content" id="pa-main-content">
        <div class="pa-page-header">
          <div>
            <h1>نمودارها</h1>
            <div class="pa-breadcrumb">
              <a href="../index.html">خانه</a>
              <span class="pa-sep">›</span>
              <span>نمودارها</span>
            </div>
          </div>
          <div class="pa-d-flex pa-gap-2">
            <button class="pa-btn pa-btn-outline pa-btn-sm" data-pa-icon="refresh" data-pa-icon-size="14" onclick="PAdminLTE.boot(document); PAdminLTE.toast({kind:'info',title:'بازنشانی',message:'نمودارها دوباره رسم شدند.'});"> بازنشانی</button>
            <button class="pa-btn pa-btn-primary pa-btn-sm" data-pa-icon="download" data-pa-icon-size="14"> خروجی</button>
          </div>
        </div>

        <div class="pa-row">
          <!-- Line chart -->
          <div class="pa-col-6">
            <div class="pa-card">
              <div class="pa-card-header">
                <h3>نمودار خطی</h3>
                <div class="pa-tools"><button data-pa-card-tool="collapse" aria-label="جمع کردن"></button></div>
              </div>
              <div class="pa-card-body">
                <div class="pa-chart-wrap">
                  <canvas data-pa-chart="line" data-pa-chart-data='{"labels":["فروردین","اردیبهشت","خرداد","تیر","مرداد","شهریور","مهر","آبان","آذر","دی","بهمن","اسفند"],"series":[{"label":"فروش","values":[12,19,15,25,22,30,28,35,32,40,38,45]},{"label":"هزینه","values":[8,12,10,15,18,20,19,22,24,26,25,28]}],"colors":["#0d6efd","#dc3545"]}'></canvas>
                </div>
                <div class="pa-chart-legend">
                  <span class="pa-cl-item"><span class="pa-cl-dot" style="background:#0d6efd"></span> فروش</span>
                  <span class="pa-cl-item"><span class="pa-cl-dot" style="background:#dc3545"></span> هزینه</span>
                </div>
              </div>
            </div>
          </div>

          <!-- Bar chart -->
          <div class="pa-col-6">
            <div class="pa-card">
              <div class="pa-card-header">
                <h3>نمودار میله‌ای</h3>
                <div class="pa-tools"><button data-pa-card-tool="collapse" aria-label="جمع کردن"></button></div>
              </div>
              <div class="pa-card-body">
                <div class="pa-chart-wrap">
                  <canvas data-pa-chart="bar" data-pa-chart-data='{"labels":["شنبه","یکشنبه","دوشنبه","سه‌شنبه","چهارشنبه","پنجشنبه","جمعه"],"series":[{"label":"فروش","values":[30,45,38,52,48,60,55]},{"label":"بازدید","values":[100,120,140,135,160,180,170]}],"colors":["#0d6efd","#198754"]}'></canvas>
                </div>
                <div class="pa-chart-legend">
                  <span class="pa-cl-item"><span class="pa-cl-dot" style="background:#0d6efd"></span> فروش</span>
                  <span class="pa-cl-item"><span class="pa-cl-dot" style="background:#198754"></span> بازدید</span>
                </div>
              </div>
            </div>
          </div>

          <!-- Donut chart -->
          <div class="pa-col-6">
            <div class="pa-card">
              <div class="pa-card-header">
                <h3>نمودار دونات</h3>
                <div class="pa-tools"><button data-pa-card-tool="collapse" aria-label="جمع کردن"></button></div>
              </div>
              <div class="pa-card-body">
                <div class="pa-chart-wrap">
                  <canvas data-pa-chart="donut" data-pa-chart-data='[{"value":35},{"value":25},{"value":20},{"value":20}]' data-pa-chart-colors='["#0d6efd","#198754","#ffc107","#dc3545"]'></canvas>
                </div>
                <div class="pa-chart-legend">
                  <span class="pa-cl-item"><span class="pa-cl-dot" style="background:#0d6efd"></span> مستقیم — ۳۵٪</span>
                  <span class="pa-cl-item"><span class="pa-cl-dot" style="background:#198754"></span> ارجاعی — ۲۵٪</span>
                  <span class="pa-cl-item"><span class="pa-cl-dot" style="background:#ffc107"></span> اجتماعی — ۲۰٪</span>
                  <span class="pa-cl-item"><span class="pa-cl-dot" style="background:#dc3545"></span> سایر — ۲۰٪</span>
                </div>
              </div>
            </div>
          </div>

          <!-- Sparklines -->
          <div class="pa-col-6">
            <div class="pa-card">
              <div class="pa-card-header"><h3>اسپارک‌لاین‌ها</h3></div>
              <div class="pa-card-body">
                <div class="pa-d-flex pa-justify-between pa-align-center pa-mb-2">
                  <div>
                    <div class="pa-fs-sm pa-text-muted">بازدید روزانه</div>
                    <div class="pa-fw-700 pa-fs-lg">۲٬۴۵۰</div>
                  </div>
                  <div style="flex:1; max-width:200px; height:40px">
                    <canvas height="40" data-pa-chart="sparkline" data-pa-chart-data='{"values":[5,8,7,12,9,15,18,14,20,22,19,25],"color":"#0d6efd"}'></canvas>
                  </div>
                </div>
                <hr>
                <div class="pa-d-flex pa-justify-between pa-align-center pa-mb-2">
                  <div>
                    <div class="pa-fs-sm pa-text-muted">فروش هفتگی</div>
                    <div class="pa-fw-700 pa-fs-lg">۹۸٬۴۰۰٬۰۰۰ ت</div>
                  </div>
                  <div style="flex:1; max-width:200px; height:40px">
                    <canvas height="40" data-pa-chart="sparkline" data-pa-chart-data='{"values":[20,18,22,19,25,28,24,30,27,33,35,32],"color":"#198754"}'></canvas>
                  </div>
                </div>
                <hr>
                <div class="pa-d-flex pa-justify-between pa-align-center pa-mb-2">
                  <div>
                    <div class="pa-fs-sm pa-text-muted">هزینه‌های متغیر</div>
                    <div class="pa-fw-700 pa-fs-lg">۱۲٬۳۰۰٬۰۰۰ ت</div>
                  </div>
                  <div style="flex:1; max-width:200px; height:40px">
                    <canvas height="40" data-pa-chart="sparkline" data-pa-chart-data='{"values":[8,10,7,12,9,6,11,8,14,10,7,9],"color":"#ffc107"}'></canvas>
                  </div>
                </div>
                <hr>
                <div class="pa-d-flex pa-justify-between pa-align-center">
                  <div>
                    <div class="pa-fs-sm pa-text-muted">کاربران فعال</div>
                    <div class="pa-fw-700 pa-fs-lg">۸۷۲ نفر</div>
                  </div>
                  <div style="flex:1; max-width:200px; height:40px">
                    <canvas height="40" data-pa-chart="sparkline" data-pa-chart-data='{"values":[3,5,4,7,9,8,12,11,15,14,18,20],"color":"#dc3545"}'></canvas>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div data-pa-layout="footer"></div>
      </main>
    </div>
  </div>
  <script src="../js/pa-icons.js"></script>
  <script src="../js/padminlte.js"></script>
  <script src="../js/pa-layout.js"></script>
</body>
</html>
