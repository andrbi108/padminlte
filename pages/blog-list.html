<!doctype html>
<html lang="fa" dir="rtl" data-pa-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PAdminLTE — وبلاگ</title>
  <link rel="stylesheet" href="../css/padminlte.css">
</head>
<body>
  <a class="pa-skip-link" href="#pa-main-content">پرش به محتوا</a>
  <div data-pa-layout="site-nav"></div>

  <main class="pa-site-main" id="pa-main-content">
        <div class="pa-page-header">
          <div>
            <h1>وبلاگ</h1>
            <div class="pa-breadcrumb"><a href="landing.html">خانه</a><span class="pa-sep">›</span><span>وبلاگ</span></div>
          </div>
        </div>

        <!-- Toolbar -->
        <div class="pa-card pa-mb-2">
          <div class="pa-card-body pa-d-flex pa-align-center pa-gap-2" style="flex-wrap:wrap">
            <div class="pa-input-group" style="flex:1 1 320px">
              <span class="pa-input-addon"><span data-pa-icon="search" data-pa-icon-size="16"></span></span>
              <input id="blog-search" class="pa-input" type="search" placeholder="جستجو در مطالب وبلاگ…" data-pa-searchable-list="#blog-grid" aria-label="جستجو در مطالب">
            </div>
            <select id="blog-cat" class="pa-select" style="flex:0 0 200px" aria-label="فیلتر دسته‌بندی">
              <option value="all">همه دسته‌ها</option>
              <option>فناوری</option>
              <option>طراحی</option>
              <option>برنامه‌نویسی</option>
              <option>دسترسی‌پذیری</option>
              <option>عملکرد</option>
            </select>
            <a class="pa-btn pa-btn-primary" href="blog-compose.html"><span data-pa-icon="pen" data-pa-icon-size="16"></span> نوشتن مطلب جدید</a>
          </div>
        </div>

        <div class="pa-row">
          <!-- Sidebar -->
          <div class="pa-col-3">
            <div class="pa-card pa-mb-2 pa-anim-slide-up">
              <div class="pa-card-header"><h3>دسته‌بندی‌ها</h3></div>
              <div class="pa-card-body" style="padding:0">
                <div class="pa-category-list" style="padding:.75rem" id="cat-list">
                  <a href="categories.html" class="pa-category-item"><span class="pa-cat-icon" data-pa-icon="list" data-pa-icon-size="18"></span><span class="pa-cat-name">همه مطلب‌ها</span><span class="pa-cat-count" id="cat-count-all">—</span><span class="pa-chevron" data-pa-icon="chevron_left" data-pa-icon-size="14"></span></a>
                  <a href="categories.html" class="pa-category-item"><span class="pa-cat-icon" data-pa-icon="cpu" data-pa-icon-size="18"></span><span class="pa-cat-name">فناوری</span><span class="pa-cat-count" id="cat-count-فناوری">—</span><span class="pa-chevron" data-pa-icon="chevron_left" data-pa-icon-size="14"></span></a>
                  <a href="categories.html" class="pa-category-item"><span class="pa-cat-icon" data-pa-icon="palette" data-pa-icon-size="18"></span><span class="pa-cat-name">طراحی</span><span class="pa-cat-count" id="cat-count-طراحی">—</span><span class="pa-chevron" data-pa-icon="chevron_left" data-pa-icon-size="14"></span></a>
                  <a href="categories.html" class="pa-category-item"><span class="pa-cat-icon" data-pa-icon="code" data-pa-icon-size="18"></span><span class="pa-cat-name">برنامه‌نویسی</span><span class="pa-cat-count" id="cat-count-برنامه‌نویسی">—</span><span class="pa-chevron" data-pa-icon="chevron_left" data-pa-icon-size="14"></span></a>
                </div>
              </div>
            </div>

            <div class="pa-card pa-mb-2 pa-anim-slide-up pa-anim-delay-1">
              <div class="pa-card-header"><h3>برچسب‌های محبوب</h3></div>
              <div class="pa-card-body">
                <div class="pa-tag-cloud">
                  <a href="blog-list.html" class="pa-tag pa-tag-size-xl">JavaScript</a>
                  <a href="blog-list.html" class="pa-tag pa-tag-size-md">CSS</a>
                  <a href="blog-list.html" class="pa-tag pa-tag-size-lg">React</a>
                  <a href="blog-list.html" class="pa-tag pa-tag-size-sm">HTML</a>
                  <a href="blog-list.html" class="pa-tag pa-tag-size-lg">Node.js</a>
                  <a href="blog-list.html" class="pa-tag pa-tag-size-md">Vue</a>
                  <a href="blog-list.html" class="pa-tag pa-tag-size-xs">GraphQL</a>
                  <a href="blog-list.html" class="pa-tag pa-tag-size-md">UI/UX</a>
                  <a href="blog-list.html" class="pa-tag pa-tag-size-xl">Performance</a>
                  <a href="blog-list.html" class="pa-tag pa-tag-size-sm">Docker</a>
                  <a href="blog-list.html" class="pa-tag pa-tag-size-md">TypeScript</a>
                  <a href="blog-list.html" class="pa-tag pa-tag-size-xs">A11Y</a>
                </div>
              </div>
            </div>

            <div class="pa-card pa-anim-slide-up pa-anim-delay-2">
              <div class="pa-card-header"><h3>مطالب اخیر</h3></div>
              <div class="pa-card-body" style="padding:0">
                <ul style="list-style:none; margin:0; padding:0" id="recent-list"></ul>
              </div>
            </div>
          </div>

          <!-- Main blog grid -->
          <div class="pa-col-9">
            <div class="pa-row" id="blog-grid"></div>
            <div class="pa-g-empty" id="blog-empty">
              <div data-pa-icon="book" data-pa-icon-size="42" style="opacity:.4"></div>
              <p>مطلبی مطابق فیلتر یا جستجوی شما پیدا نشد.</p>
            </div>

            <!-- Pagination -->
            <div class="pa-card">
              <div class="pa-card-body pa-d-flex pa-align-center pa-gap-1" style="justify-content:center">
                <button class="pa-btn pa-btn-ghost pa-btn-sm" aria-label="صفحه قبل"><span data-pa-icon="chevron_right" data-pa-icon-size="14"></span></button>
                <button class="pa-btn pa-btn-primary pa-btn-sm">۱</button>
                <button class="pa-btn pa-btn-ghost pa-btn-sm">۲</button>
                <button class="pa-btn pa-btn-ghost pa-btn-sm">۳</button>
                <button class="pa-btn pa-btn-ghost pa-btn-sm" aria-label="صفحه بعد"><span data-pa-icon="chevron_left" data-pa-icon-size="14"></span></button>
              </div>
            </div>
          </div>
        </div>

  </main>

  <div data-pa-layout="site-footer"></div>
  <script src="../js/pa-icons.js"></script>
  <script src="../js/padminlte.js"></script>
  <script src="../js/pa-layout.js"></script>
  <script>
    // Store-backed blog: reads 'pa-blog-posts' (seeded on first run).
    // New posts written in blog-compose.html appear here automatically.
    (function () {
      var SEED = [
        { id: 'b1', title: 'آموزش طراحی رابط کاربری مدرن', category: 'طراحی', cover: 'linear-gradient(135deg,#0d6efd,#6610f2)', author: 'سارا کریمی', color: 'var(--pa-primary)', date: '۱۴۰۳/۰۸/۱۲', readTime: '۸ دقیقه', comments: 18, views: 1240, likes: 96, excerpt: 'در این مطلب با اصول طراحی رابط کاربری مدرن، استفاده از فضای سفید، تایپوگرافی مناسب و انتخاب پالت رنگی آشنا می‌شوید.' },
        { id: 'b2', title: '۱۰ نکته برای بهینه‌سازی Performance', category: 'عملکرد', cover: 'linear-gradient(135deg,#198754,#20c997)', author: 'امیر رضایی', color: 'var(--pa-success)', date: '۱۴۰۳/۰۸/۱۰', readTime: '۱۲ دقیقه', comments: 24, views: 2130, likes: 158, excerpt: 'بهبود سرعت بارگذاری صفحات وب یکی از مهم‌ترین فاکتورهای تجربه کاربری و سئوست. در این مطلب ۱۰ تکنیک کاربردی را مرور می‌کنیم.' },
        { id: 'b3', title: 'معرفی CSS Grid', category: 'طراحی', cover: 'linear-gradient(135deg,#fd7e14,#ffc107)', author: 'نگار محمدی', color: 'var(--pa-warning)', date: '۱۴۰۳/۰۸/۰۸', readTime: '۶ دقیقه', comments: 9, views: 870, likes: 64, excerpt: 'CSS Grid قدرتمندترین سیستم چیدمان وب است. در این مطلب با مفاهیم اصلی، خطوط شبکه و نواحی قالب آشنا می‌شوید.' },
        { id: 'b4', title: 'الگوهای طراحی در JavaScript', category: 'برنامه‌نویسی', cover: 'linear-gradient(135deg,#dc3545,#d63384)', author: 'علی نوری', color: 'var(--pa-danger)', date: '۱۴۰۳/۰۸/۰۵', readTime: '۱۵ دقیقه', comments: 32, views: 2890, likes: 201, excerpt: 'الگوهای طراحی راه‌حل‌های اثبات‌شده برای مسائل رایج برنامه‌نویسی هستند. در این مطلب الگوهای Singleton، Observer و Module را بررسی می‌کنیم.' },
        { id: 'b5', title: 'دسترسی‌پذیری در وب', category: 'دسترسی‌پذیری', cover: 'linear-gradient(135deg,#6f42c1,#0dcaf0)', author: 'مریم صادقی', color: 'var(--pa-info)', date: '۱۴۰۳/۰۸/۰۲', readTime: '۱۰ دقیقه', comments: 14, views: 1120, likes: 87, excerpt: 'ساختن وبی برای همه وظیفه‌ی هر توسعه‌دهنده‌ای است. در این مطلب اصول WCAG و تکنیک‌های ARIA را به زبان ساده توضیح می‌دهیم.' },
        { id: 'b6', title: 'ساختار پروژه‌های مقیاس‌پذیر', category: 'برنامه‌نویسی', cover: 'linear-gradient(135deg,#20c997,#0d6efd)', author: 'محمد قاسمی', color: 'var(--pa-primary)', date: '۱۴۰۳/۰۷/۲۸', readTime: '۱۴ دقیقه', comments: 21, views: 1650, likes: 133, excerpt: 'معماری مناسب پایه‌ی هر پروژه‌ی موفقی است. در این مطلب ساختار MonoRepo، تقسیم ماژول‌ها و مدیریت وابستگی‌ها را بررسی می‌کنیم.' }
      ];
      var posts = PAdminLTE.store.get('pa-blog-posts', SEED);
      var grid = document.getElementById('blog-grid');
      var empty = document.getElementById('blog-empty');
      var recent = document.getElementById('recent-list');

      function fa(n) { return String(n).replace(/\d/g, function (d) { return '۰۱۲۳۴۵۶۷۸۹'[d]; }); }
      function initial(name) { return (name || '؟').trim().charAt(0); }

      function cardHtml(p) {
        return '' +
        '<div class="pa-col-4" data-pa-search-item data-cat="' + (p.category || '') + '">' +
          '<article class="pa-blog-card pa-hover-lift">' +
            '<a class="pa-blog-thumb pa-img-zoom" href="blog-post.html?id=' + encodeURIComponent(p.id) + '" style="background:' + (p.cover || 'linear-gradient(135deg,#0d6efd,#6610f2)') + '">' +
              '<span class="pa-blog-cat">' + (p.category || 'عمومی') + '</span>' +
              (p.draft ? '<span class="pa-badge pa-badge-warning" style="position:absolute; top:.6rem; inset-inline-start:.6rem;">پیش‌نویس</span>' : '') +
            '</a>' +
            '<div class="pa-blog-body">' +
              '<div class="pa-blog-meta">' +
                '<span><span data-pa-icon="calendar" data-pa-icon-size="12"></span> ' + (p.date || '') + '</span>' +
                '<span><span data-pa-icon="user" data-pa-icon-size="12"></span> ' + (p.author || 'مهمان') + '</span>' +
                '<span><span data-pa-icon="clock" data-pa-icon-size="12"></span> ' + (p.readTime || '۵ دقیقه') + '</span>' +
              '</div>' +
              '<h3 class="pa-blog-title"><a href="blog-post.html?id=' + encodeURIComponent(p.id) + '">' + p.title + '</a></h3>' +
              '<p class="pa-blog-excerpt">' + (p.excerpt || '') + '</p>' +
            '</div>' +
            '<div class="pa-blog-footer">' +
              '<span class="pa-d-flex pa-align-center pa-gap-1"><span class="pa-avatar pa-avatar-sm" style="background:' + (p.color || 'var(--pa-primary-soft)') + '; color:#fff; display:grid; place-items:center; font-weight:700">' + initial(p.author) + '</span> ' + (p.author || 'مهمان') + '</span>' +
              '<span class="pa-text-muted"><span data-pa-icon="comments" data-pa-icon-size="14"></span> ' + fa(p.comments || 0) + '</span>' +
            '</div>' +
          '</article>' +
        '</div>';
      }

      function render() {
        grid.innerHTML = posts.map(cardHtml).join('');
        PAdminLTE.injectIcons(grid);
        applyFilter();
        // Recent sidebar: top 5
        recent.innerHTML = posts.slice(0, 5).map(function (p) {
          return '<li class="pa-d-flex pa-gap-2" style="padding:.65rem 1rem; border-bottom:1px solid var(--pa-border)">' +
            '<span style="width:48px; height:48px; border-radius:var(--pa-radius); flex-shrink:0; background:' + (p.cover || '#0d6efd') + '"></span>' +
            '<div style="min-width:0"><a href="blog-post.html?id=' + encodeURIComponent(p.id) + '" style="font-weight:600; font-size:.85rem; color:var(--pa-text)">' + p.title + '</a>' +
            '<div class="pa-fs-sm pa-text-muted"><span data-pa-icon="clock" data-pa-icon-size="12"></span> ' + (p.date || '') + '</div></div>' +
          '</li>';
        }).join('');
        PAdminLTE.injectIcons(recent);
        // Category counts
        var counts = {};
        posts.forEach(function (p) { counts[p.category] = (counts[p.category] || 0) + 1; });
        Object.keys(counts).forEach(function (c) {
          var el = document.getElementById('cat-count-' + c);
          if (el) el.textContent = fa(counts[c]) + ' مطلب';
        });
        var all = document.getElementById('cat-count-all');
        if (all) all.textContent = fa(posts.length) + ' مطلب';
      }

      function applyFilter() {
        var sel = document.getElementById('blog-cat');
        var cat = sel ? sel.value : 'all';
        var q = (document.getElementById('blog-search').value || '').toLowerCase().trim();
        var shown = 0;
        grid.querySelectorAll('[data-pa-search-item]').forEach(function (item) {
          var okCat = cat === 'all' || item.getAttribute('data-cat') === cat;
          var okQ = !q || item.textContent.toLowerCase().indexOf(q) !== -1;
          var ok = okCat && okQ;
          item.style.display = ok ? '' : 'none';
          if (ok) shown++;
        });
        empty.style.display = shown ? 'none' : 'block';
      }

      var sel = document.getElementById('blog-cat');
      if (sel) sel.addEventListener('change', applyFilter);
      document.getElementById('blog-search').addEventListener('input', applyFilter);
      render();
    })();
  </script>
</body>
</html>
