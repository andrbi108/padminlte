<!doctype html>
<html lang="fa" dir="rtl" data-pa-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PAdminLTE — ثبت‌نام</title>
  <link rel="stylesheet" href="../css/padminlte.css">
</head>
<body class="pa-auth-page">
  <div class="pa-auth-card pa-wide">
    <div class="pa-auth-logo">P</div>
    <h1>ایجاد حساب جدید</h1>
    <p class="pa-sub">برای استفاده از امکانات، ثبت‌نام کنید</p>

    <form id="register-form">
      <div class="pa-form-row">
        <div class="pa-form-group">
          <label for="firstname">نام</label>
          <div class="pa-input-group">
            <span class="pa-input-addon" data-pa-icon="user" data-pa-icon-size="16"></span>
            <input class="pa-input" type="text" id="firstname" data-pa-validate="required" required>
          </div>
          <div class="pa-form-feedback"></div>
        </div>
        <div class="pa-form-group">
          <label for="lastname">نام خانوادگی</label>
          <input class="pa-input" type="text" id="lastname" data-pa-validate="required" required>
          <div class="pa-form-feedback"></div>
        </div>
      </div>
      <div class="pa-form-group">
          <label for="email">ایمیل</label>
          <div class="pa-input-group">
            <span class="pa-input-addon" data-pa-icon="envelope" data-pa-icon-size="16"></span>
            <input class="pa-input" type="email" id="email" data-pa-validate="email" required>
          </div>
          <div class="pa-form-feedback"></div>
        </div>
      <div class="pa-form-row">
        <div class="pa-form-group">
          <label for="password">رمز عبور</label>
          <div class="pa-input-group">
            <span class="pa-input-addon" data-pa-icon="lock" data-pa-icon-size="16"></span>
            <input class="pa-input" type="password" id="password" data-pa-validate="minlen" data-pa-minlen="6" required>
          </div>
          <div class="pa-form-feedback"></div>
        </div>
        <div class="pa-form-group">
          <label for="confirm">تکرار رمز عبور</label>
          <input class="pa-input" type="password" id="confirm" data-pa-validate="minlen" data-pa-minlen="6" required>
          <div class="pa-form-feedback"></div>
        </div>
      </div>
      <div class="pa-form-check">
        <input type="checkbox" id="agree" required>
        <label for="agree">با <a href="terms.html">قوانین و مقررات</a> موافقم</label>
      </div>
      <button type="submit" class="pa-btn pa-btn-primary pa-btn-block pa-btn-lg">ثبت‌نام</button>
    </form>
    <p class="pa-text-center pa-text-muted pa-fs-sm pa-mt-2">حساب دارید؟ <a href="login.html">وارد شوید</a></p>
  </div>
  <script src="../js/pa-icons.js"></script>
  <script src="../js/padminlte.js"></script>
  <script>
    (function () {
      var form = document.getElementById('register-form');
      var btn = form.querySelector('button[type="submit"]');
      form.addEventListener('submit', function (e) {
        e.preventDefault();
        if (!PAdminLTE.validateForm(form)) return;
        var pass = document.getElementById('password').value;
        var confirm = document.getElementById('confirm').value;
        if (pass !== confirm) {
          PAdminLTE.toast({ kind: 'danger', title: 'خطا', message: 'رمز عبور و تکرار آن یکسان نیستند.' });
          document.getElementById('confirm').classList.add('is-invalid');
          return;
        }
        var first = document.getElementById('firstname').value.trim();
        var last = document.getElementById('lastname').value.trim();
        PAdminLTE.btnLoading(btn, true, 'در حال ایجاد حساب…');
        setTimeout(function () {
          var u = PAdminLTE.auth.register({
            name: (first + ' ' + last).trim(),
            email: document.getElementById('email').value,
            pass: pass,
            role: 'نویسنده',
            color: '#0aa6c2'
          });
          PAdminLTE.btnLoading(btn, false);
          if (u) {
            PAdminLTE.toast({ kind: 'success', title: 'ثبت‌نام موفق', message: 'حساب شما ساخته شد؛ وارد شدید. خوش آمدید ' + u.name + '!' });
            setTimeout(function () { location.href = '../index.html'; }, 800);
          } else {
            PAdminLTE.toast({ kind: 'danger', title: 'خطا', message: 'این ایمیل قبلاً ثبت شده است. ایمیل دیگری وارد کنید.' });
          }
        }, 1000);
      });
    })();
  </script>
</body>
</html>
